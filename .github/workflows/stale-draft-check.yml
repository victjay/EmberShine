name: Stale Draft Check

on:
  schedule:
    - cron: '0 * * * *'  # 매시간 실행
  workflow_dispatch:       # 수동 실행 가능

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check stale processing items
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # processing 상태가 1시간 이상된 항목 조회
          RESULT=$(curl -s \
            "${SUPABASE_URL}/rest/v1/inbox_messages?status=eq.processing&created_at=lt.$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)&select=id,created_at" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

          COUNT=$(echo $RESULT | python3 -c "import sys,json; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "0")

          if [ "$COUNT" -gt "0" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=⚠️ AI 초안 처리 지연 감지: ${COUNT}개 항목이 1시간 이상 processing 상태입니다. /private/inbox 확인 바랍니다."
          fi
